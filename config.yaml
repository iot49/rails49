# ====================================================================================
# Global parameters
# ====================================================================================
global:
  # Base domain name the site is published under
  rails_domain: "rails49.org"

# ====================================================================================
# Classifier parameters (syncs to config.json during model export)
# ====================================================================================
classifier:
  # NOTE: `labels` was deleted rather than corrected. It advertised a four-tag
  # CNN vocabulary (coupling/other/track/train) that v4 cannot produce — every
  # crop derivable from a car span earns the same tag — and nothing could
  # verify it. See SPEC.md § v4 cannot produce a trainable CNN dataset.
  # Square pixel crop size for the ONNX classifier input (standard shoelace/Vite crop)
  crop_size: 96
  # Normalization values (ImageNet defaults)
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# ====================================================================================
# CNN Training hyperparameters (Python/Fastai)
# ====================================================================================
cnn:
  # Target patch crop size for training (1.5 * CROP_SIZE) to support translation jitter
  crop_size_prep: 144
  # Target Dots Per Track (DPT) resolution mapping
  sample_dpt: 20
  # Validation set split ratio
  val_split: 0.2
  # Batch size for training
  default_batch_size: 32
  # Number of training epochs
  default_num_epochs: 5
  # Optimizer learning rate
  learning_rate: 0.0001

# ====================================================================================
# Layout & Physical specifications (R49 manifest)
# ====================================================================================
layout:
  # Standard rail gauge in millimeters
  standard_gauge: 1435.0
  # Prototype mm — widest real stock (SBB RAm TEE I). Car width is derived from
  # this rather than stored per label; because width in pixels is
  # DPT * standard_width / standard_gauge, the scale ratio cancels and a car is
  # 2.09 track-widths wide in every scale. Chosen widest rather than typical:
  # an over-wide box biases toward `occupied`, the direction the occupancy
  # output deliberately errs in. See SPEC.md § Location Data.
  standard_width: 3000.0
  # Model scale to ratio mapping
  scale_to_ratio:
    G: 25
    O: 48
    S: 64
    HO: 87
    T: 120
    N: 160
    Z: 220
  # Below this a car is too few pixels across to localize reliably. Warns
  # persistently, never blocks — the fixture corpus lives at DPT 18-19. Under
  # `layout` and not `classifier` because it gates the editor.
  min_dpt: 20

# ====================================================================================
# Detector parameters (YOLO26n-OBB)
# ====================================================================================
detector:
  # 640x384 is a live fallback, not a closed door
  input: [960, 544]
  # Placeholder — needs held-out recall, which no protocol yet measures.
  # It has a floor above zero: at 0 you accept 300 padding slots as phantom
  # cars and every sensor reads `occupied` on every frame.
  confidence_threshold: 0.25
  #
  # ⚠️  APPEND-ONLY. A list position *is* a YOLO class index, so reordering or
  # deleting an entry invalidates trained weights while this file still
  # validates. It is the one config edit that can break a model with nothing
  # noticing. The generator must not sort, dedupe, or reorder it.
  #
  # A label maps to the longest entry that is a segment-prefix of its class, so
  # `stock` matches `stock.loco.steam` but never `stockyard`. Adding a subtype
  # here therefore re-maps every already-labeled car of that subtype with no
  # relabeling.
  classes: ["stock"]
  # The authoring taxonomy: what the editor's context menu offers and what a
  # label's `class` must match. The `stock.` root is required rather than
  # cosmetic — a new car is `stock` and refinements must roll up to it, so an
  # unrooted class would match no entry and be dropped from the export. The
  # root never appears in the UI; the menu renders its children.
  #
  # A nested mapping is a subtype; any other value is a property of the class
  # it sits under (`width_mm` is the one such property, an optional per-class
  # width override). That is the rule the editor reads this with — it is how a
  # property is told from a subtype without a reserved list of key names.
  #
  # Adding a subtype here costs nothing downstream: `classes` above is what a
  # label maps into, and `stock.loco.steam` still maps to `stock` until
  # `stock.loco.steam` is appended there.
  vocabulary:
    stock:
      loco:
        steam: {}
        diesel: {}
        electric: {}
      passenger: {}
      freight: {}
