[project]
name = "detector"
version = "0.1.0"
description = "YOLO26n-OBB rolling-stock detector: fine-tune, export, quantize."
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "Bernhard Boser", email = "bernhard.e.boser@gmail.com" }
]
# Upper bound, not just a floor. torch 2.2.2 is the last release with a macOS
# x86_64 wheel and it stops at cp312, so 3.13 would resolve to a source build
# that does not exist. Lift the cap with the pins below, together.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned, not floored, and all three for the same reason: this is a 2017
    # x86_64 Mac and each is the last release still shipping a wheel for it.
    # See issue #3 and detector/README.md § Why these pins.
    "torch==2.2.2",
    "torchvision==0.17.2",
    "onnxruntime==1.23.2",
    # torch 2.2.2 is built against the NumPy 1.x C API and aborts at import
    # under 2.x.
    "numpy<2",
    "ultralytics>=8.4.115",
    "onnx>=1.16.0",
    # Declared, not left to Ultralytics' `requirements: AutoUpdate`, which pip
    # installs it into the venv mid-export when `simplify=True` — a self-
    # modifying environment that uv.lock does not describe.
    "onnxslim>=0.1.95",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "pyright>=1.1.385",
    "ruff>=0.4.10",
]
