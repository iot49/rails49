packages:
  - "lib/*"
  # Executables, not libraries: consumed by a foreign CI rather than imported by
  # ui/ or dataset/, and deliberately outside lib/ so they carry none of its
  # dependencies. See tools/r49-validate.
  - "tools/*"
  - "dataset"
  - "ui"
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  sharp: true
